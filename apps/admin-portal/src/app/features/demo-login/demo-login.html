<main class="demo-entry">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <section class="login-shell" aria-labelledby="login-title">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M6 9.5 16 4l10 5.5v13L16 28 6 22.5v-13Z" />
          <path d="m6.5 9.5 9.5 5.4 9.5-5.4M16 15v12.2" />
          <path d="m11.5 7 10 5.5" />
        </svg>
      </span>
      <span class="brand-name">Procure<span>AI</span></span>
    </div>

    <mat-card class="login-card">
      <mat-card-content>
        <div class="eyebrow"><span></span> PROCUREMENT WORKSPACE</div>
        <h1 id="login-title">Welcome back</h1>
        <p class="intro">Sign in to continue to your procurement workspace.</p>

        <form [formGroup]="loginForm" (ngSubmit)="enter()">
          <div class="form-field">
            <label for="email">Work email</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              autocomplete="username"
              placeholder="you@company.com"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                id="password"
                [type]="passwordVisible() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              />
              <button
                mat-button
                class="visibility-toggle"
                type="button"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
              >
                {{ passwordVisible() ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>

          <button class="form-submit" mat-flat-button type="submit">
            Sign In
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <div class="demo-note">
          <span class="note-icon" aria-hidden="true">i</span>
          <p>
            <strong>Demo environment</strong>
            Credentials are not verified or sent to a server.
          </p>
        </div>
      </mat-card-content>
    </mat-card>

    <p class="page-footer">Procure smarter. Work better.</p>
  </section>
</main>
