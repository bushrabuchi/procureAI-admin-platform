<header class="topbar">
  <div class="page-heading">
    <h2>Procurement Workspace</h2>
    <p>Manage your operations efficiently</p>
  </div>

  <div class="header-actions">
    <div class="search-box">
      <app-icon [img]="icons.Search" [size]="18"></app-icon>
      <input
        type="search"
        placeholder="Search..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </div>

    <button
      class="icon-button"
      type="button"
      aria-label="Toggle theme"
      (click)="theme.toggleTheme()"
    >
      @if (theme.isDark()) {
        <app-icon [img]="icons.Sun"></app-icon>
      } @else {
        <app-icon [img]="icons.Moon"></app-icon>
      }
    </button>

    <div class="dropdown-wrapper">
      <button
        class="icon-button"
        type="button"
        aria-label="Notifications"
        [matMenuTriggerFor]="notificationsMenu"
      >
        <app-icon [img]="icons.Bell"></app-icon>
        <span class="notification-dot"></span>
      </button>

      <mat-menu #notificationsMenu="matMenu" class="header-dropdown-panel">
        <div class="notification-menu-content">
          <div class="notification-menu-heading">
            <strong>Notifications</strong>
            <span>Recent activity</span>
          </div>
          @for (item of notifications; track item) {
            <div class="notification-item">
              <span class="notification-indicator" aria-hidden="true"></span>
              <p>{{ item }}</p>
            </div>
          }
        </div>
      </mat-menu>
    </div>

    <div class="dropdown-wrapper">
      <button
        mat-button
        class="profile-button"
        type="button"
        aria-label="Admin profile"
        [matMenuTriggerFor]="profileMenu"
      >
        <span class="profile-button-content">
          <span class="avatar">AD</span>
          <span class="profile-name">Admin</span>
          <app-icon [img]="icons.ChevronDown" [size]="15"></app-icon>
        </span>
      </button>

      <mat-menu #profileMenu="matMenu" class="header-dropdown-panel">
        <div class="profile-dropdown-heading">
          <span class="avatar">AD</span>
          <span class="profile-dropdown-identity">
            <strong>Admin User</strong>
            <small>Procurement Administrator</small>
          </span>
        </div>
        <a mat-menu-item routerLink="/settings">
          <span class="material-symbols-outlined" aria-hidden="true">manage_accounts</span>
          <span>{{ 'Account settings' }}</span>
        </a>
        <button mat-menu-item type="button" (click)="signOut()">
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>
