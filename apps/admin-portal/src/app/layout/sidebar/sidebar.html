<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon brand-logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2.75 14.2 9.8 21.25 12l-7.05 2.2L12 21.25 9.8 14.2 2.75 12 9.8 9.8 12 2.75Z" />
        <circle cx="19.5" cy="4.5" r="1.25" />
        <circle cx="4.5" cy="19.5" r="1.25" />
      </svg>
    </div>
    <div>
      <div class="brand-name brand-wordmark">
        Procure<span class="brand-wordmark-accent">AI</span>
      </div>
      <small class="brand-context">ENTERPRISE PLATFORM</small>
    </div>
  </div>

  <div class="menu-label">WORKSPACE</div>

  <nav class="nav-menu">
    <a
      *ngFor="let item of menu"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <app-icon [img]="item.icon" [size]="20"> </app-icon>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="workspace-badge">Enterprise Workspace</div>
    <p>ProcureAI v1.0</p>
  </div>
</aside>
