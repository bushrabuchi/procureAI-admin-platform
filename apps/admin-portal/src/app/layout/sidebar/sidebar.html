<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">P</div>
    <div class="brand-name">
      Procure<span>AI</span>
      <small>ENTERPRISE PLATFORM</small>
    </div>
  </div>

  <div class="menu-label">WORKSPACE</div>

  <nav class="nav-menu">
    <a
      *ngFor="let item of menu"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <app-icon [img]="item.icon" [size]="20"> </app-icon>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="portal-switcher">
    <p class="portal-label">OTHER PORTALS</p>

    <a class="portal-link" [href]="supplierPortalUrl" target="_blank" rel="noopener noreferrer">
      <span class="portal-icon material-symbols-outlined" aria-hidden="true">storefront</span>
      <span class="portal-link-copy">
        <strong>Supplier Portal</strong>
        <small>Open supplier workspace</small>
      </span>
      <span class="external-icon material-symbols-outlined" aria-hidden="true">open_in_new</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <div class="workspace-badge">Enterprise Workspace</div>
    <p>ProcureAI v1.0</p>
  </div>
</aside>
